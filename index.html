function DEFTPL(){return{tg:`# ШАРТНОМАИ № {{номер_договора}}
# оид ба харидории манзил бо пардохти ақсотӣ
Шаҳри ______________ · {{дата}}
{{компания}} (минбаъд — «Фурӯшанда»), ки аз ҷониби {{представитель}} амал мекунад, аз як тараф, ва {{покупатель}} (минбаъд — «Харидор»), аз тарафи дигар, ин шартномаро бо мазмуни зерин мебанданд:
1. Мавзӯи шартнома
1.1. Фурӯшанда манзили рақами {{номер}}-ро дар маҷмааи «{{жк}}» ({{этаж}}, {{комнат}} ҳуҷра, масоҳати умумӣ {{площадь}} м²) ба Харидор мефурӯшад, ва Харидор пардохти арзиши онро мувофиқи шартҳои ин шартнома ба ӯҳда мегирад.
2. Арзиш ва тартиби пардохт
2.1. Арзиши умумии манзил {{стоимость}}-ро ташкил медиҳад (нархи як метри мураббаъ — {{цена_м2}}).
2.2. Харидор пардохти аввалияро ба маблағи {{взнос}} ҳангоми имзои шартнома месупорад.
2.3. Боқимондаи арзиш — {{остаток_договора}} — дар муддати {{срок}} моҳ бо қисмҳои баробар ба маблағи {{ежемесячно}} то рӯзи {{день}}-уми ҳар моҳ пардохт карда мешавад. Пардохти охирин — то {{дата_последнего}}.
2.4. Ҷадвали муфассали пардохт (Замима № 1) қисми ҷудонашавандаи ин шартнома мебошад.
3. Ҳуқуқу ӯҳдадориҳои тарафҳо
3.1. Харидор ӯҳдадор аст, ки пардохтҳоро мувофиқи Ҷадвал саривақт анҷом диҳад.
3.2. Фурӯшанда ӯҳдадор аст, ки пас аз пардохти пурраи арзиши манзил онро ба Харидор супорад ва ҳуҷҷатҳои заруриро расмӣ намояд.

4. Шартҳои хотимавӣ
4.1. Баҳсҳо тавассути гуфтушунид, ва дар сурати ноком шудан — тибқи қонунгузории Ҷумҳурии Тоҷикистон дар суд ҳал карда мешаванд.
4.2. Шартнома дар ду нусха бо як қуввати ҳуқуқӣ тартиб дода шуда, барои ҳар як тараф як нусха дода мешавад.
4.3. Тағйиру иловаҳо танҳо дар шакли хаттӣ ва бо имзои ҳарду тараф эътибор доранд.`,
ru:`# ДОГОВОР № {{номер_договора}}

г. ______________ · {{дата}}
{{компания}} (далее — «Продавец») в лице {{представитель}}, с одной стороны, и {{покупатель}} (далее — «Покупатель»), с другой стороны, заключили настоящий договор о нижеследующем:

1.1. Продавец продаёт Покупателю квартиру № {{номер}} в жилом комплексе «{{жк}}» ({{этаж}}, комнат: {{комнат}}, общая площадь {{площадь}} м²), а Покупатель обязуется оплатить её стоимость на условиях настоящего договора.

2.4. Подробный график платежей (Приложение № 1) является неотъемлемой частью настоящего договора.
3. Права и обязанности сторон
3.1. Покупатель обязан вносить платежи своевременно в соответствии с Графиком.
3.2. Продавец обязан после полной оплаты стоимости передать квартиру Покупателю и оформить необходимые документы.
3.3. При просрочке платежа стороны решают вопрос путём переговоров; дополнительные меры определяются по соглашению сторон или в соответствии с законодательством Республики Таджикистан.
4. Заключительные положения
4.1. Споры решаются путём переговоров, а при недостижении согласия — в суде в соответствии с законодательством Республики Таджикистан.
4.2. Договор составлен в двух экземплярах, имеющих одинаковую юридическую силу, по одному для каждой стороны.
4.3. Изменения и дополнения действительны только в письменной форме и при наличии подписей обеих сторон.`}}

function fillTpl(t,a,b,L,lang){const F=lang==='tg'?(f=>f<0?'таҳхона':'ошёнаи '+f):FL,last=L[L.length-1],V={'номер_договора':a.n+'/'+new Date(b.start+'T00:00:00').getFullYear(),'номер':a.n,'жк':S.project,'компания':S.company,'этаж':F(a.fl),'комнат':a.rooms,'площадь':a.area,'покупатель':a.name,'телефон':a.phone,'стоимость':fm(total(a)),'цена_м2':fm(a.ppm),'взнос':fm(a.down),'остаток_договора':fm(total(a)-a.down),'срок':a.term,'ежемесячно':fm(monthly(a)),'день':a.day,'дата':fd(b.start),'дата_последнего':last?fd(last.d):'—','представитель':(me.pos?me.pos+' ':'')+me.name};

const sh=`<h1>${X.t}</h1><div class="s">${X.ap}${cn} · ${esc(S.company)} · ${esc(S.project)} · ${X.pd}: ${new Date().toLocaleDateString('ru-RU')}</div>
<table class="i"><tr><td>${X.obj}</td><td>№${a.n} · ${esc(F(a.fl))} · ${a.rooms} ${X.rm} · ${a.area} м²</td></tr><tr><td>${X.buyer}</td><td>${esc(a.name)} ${esc(a.phone)}</td></tr><tr><td>${X.sd}</td><td>${fd(b.start)}${a.start?'':X.prel}</td></tr><tr><td>${X.cost}</td><td>${fm(total(a))}</td></tr><tr><td>${X.down}</td><td>${fm(a.down)}</td></tr><tr><td>${X.term}</td><td>${a.term} ${X.mo} · ${fm(monthly(a))} · ${X.until} ${a.day}${X.ofm}</td></tr><tr><td>${X.paid}</td><td>${fm(a.paid)} · ${X.rest}: ${fm(total(a)-a.paid)}</td></tr></table>
<table><thead><tr><th>${X.no}</th><th>${X.date}</th><th class="r">${X.amt}</th><th class="r">${X.bal}</th><th>${X.mark}</th></tr></thead><tbody>${rows}</tbody></table>${cur==='TJS'?`<div class="s">${X.cur}${S.rate} TJS.</div>`:''}${sig(false)}`;
const ct=fillTpl(S.tpl[lang]||'',a,b,L,lang).split('\n').filter(x=>x.trim()).map(l=>l.startsWith('# ')?`<h2>${l.slice(2)}</h2>`:/^\d+\.\s/.test(l)?`<h3>${l}</h3>`:`<p>${l}</p>`).join('');

function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.apts)||!Array.isArray(d.pays)||!Array.isArray(d.users))throw 0;if(!confirm('Заменить все данные на этом устройстве данными из копии?'))return;apts=d.apts;pays=d.pays;users=d.users;S=Object.assign(S,d.set||{});sv();me=users.find(u=>u.login===me.login)||null;draw()}catch{alert('Файл не похож на резервную копию CRM')}};r.readAsText(f)}

const pl=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<15?c:k===1?a:k>1&&k<5?b:c};
const R1=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'],R1f=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'],R10=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'],R2=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'],R3=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];

function late(){const ls=apts.filter(overdue);return tbl(['№','Покупатель','Телефон','Сумма просрочки','Дней просрочки','Менеджер'],ls.map(a=>{const ov=overdue(a);return[link(a.n),esc(a.name),esc(a.phone||'—'),`<span class="text-red-400 font-bold">${fm(ov.short)}</span>`,ov.days+' дн.',esc(a.mgr||'—')]}))}
function log(){const ls=pays.filter(p=>!qq||p.client.toLowerCase().includes(qq.toLowerCase())||String(p.apt).includes(qq));return tbl(['ПКО №','Дата','Квартира','Покупатель','Сумма','Менеджер','Примечание','Действие'],ls.map(p=>['№'+(p.no||'—'),new Date(p.date).toLocaleString('ru-RU'),link(p.apt),esc(p.client),`<span class="text-emerald-400 font-bold">${p.cur==='USD'?'$'+p.usd.toLocaleString():(p.amt||p.usd*S.rate).toLocaleString()+' c.'}</span>`,esc(p.mgr),esc(p.cm&&p.cm[0]?p.cm[0].x:'—'),can('print')?`<button onclick="printPKO(${p.id})" class="text-blue-400 hover:underline"><i class="fa-solid fa-print"></i> ПКО</button>`:'']))}
function set(){return `<div class="grid lg:grid-cols-2 gap-4"><div class="${C} p-5"><h3 class="font-semibold mb-3">Настройки компании</h3><div class="space-y-3"><div><label class="text-xs text-slate-400">Название компании</label><input id="st_co" class="${IN}" value="${esc(S.company)}"></div><div><label class="text-xs text-slate-400">Название ЖК / Проекта</label><input id="st_pr" class="${IN}" value="${esc(S.project)}"></div><div><label class="text-xs text-slate-400">Курс USD к TJS</label><input id="st_rt" type="number" step="0.01" class="${IN}" value="${S.rate}"></div><button class="${BTN}" onclick="S.company=$('#st_co').value;S.project=$('#st_pr').value;S.rate=parseFloat($('#st_rt').value)||S.rate;sv();alert('Настройки сохранены');draw()">Сохранить настройки</button></div></div>${tplUI()}</div>${backupUI()}`}

function draw(){document.title=S.company+' — CRM';if(!me)return loginView();if(!TABS().some(x=>x[0]===tab))tab='chess';
$('#app').innerHTML=`<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30"><div class="max-w-screen-2xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center"><i class="fa-solid fa-building"></i></div><div><div class="font-bold leading-tight">${esc(S.company)}</div><div class="text-xs text-slate-500">${esc(S.project)}</div></div></div>
<div class="flex items-center gap-3"><div class="flex bg-slate-950 border border-slate-800 rounded-xl p-1 text-sm">${['USD','TJS'].map(c=>`<button onclick="cur='${c}';sv();draw()" class="px-3 py-1 rounded-lg transition ${cur===c?'bg-blue-600 text-white':'text-slate-400 hover:text-white'}">${c==='USD'?'$ USD':'c. TJS'}</button>`).join('')}</div>
<div class="text-right text-sm hidden sm:block"><div>${esc(me.name)}</div><div class="text-xs text-slate-500">${esc(me.pos||'')}${me.pos?' · ':''}${esc((roleOf(me.role)||{name:me.role}).name)}</div></div><button onclick="chPass()" class="text-slate-400 hover:text-white" title="Сменить пароль"><i class="fa-solid fa-key"></i></button><button onclick="logout()" class="text-slate-400 hover:text-white" title="Выйти"><i class="fa-solid fa-right-from-bracket"></i></button></div></div></header>
<main class="max-w-screen-2xl mx-auto p-4">${metrics()}<nav class="flex gap-2 overflow-x-auto mb-4">${TABS().map(([k,t,i])=>`<button onclick="tab='${k}';qq='';draw()" class="whitespace-nowrap px-4 py-2 rounded-xl text-sm border transition ${tab===k?'bg-blue-600 border-blue-600 text-white':'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'}"><i class="fa-solid ${i} mr-2"></i>${t}</button>`).join('')}</nav>${mfBar()}${['owners','inst','next','late','log'].includes(tab)&&can('export')?`<div class="flex justify-end gap-2 mb-3"><button onclick="exportPDF()" class="bg-slate-900 border border-slate-800 hover:border-blue-600 transition rounded-xl px-4 py-2 text-sm"><i class="fa-solid fa-file-pdf text-red-400 mr-2"></i>Экспорт PDF</button><button onclick="exportXLSX()" class="bg-slate-900 border border-slate-800 hover:border-blue-600 transition rounded-xl px-4 py-2 text-sm"><i class="fa-solid fa-file-excel text-emerald-400 mr-2"></i>Экспорт Excel</button></div>`:''}<div id="view"></div></main>`;
$('#view').innerHTML=({chess,dash,owners,inst,next,late,log,set})[tab]();if(tab==='chess')grid()}

function openApt(n){const a=apts.find(x=>x.n===n);if(!a)return;const s=st(a);
$('#modal').innerHTML=`<div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto"><div class="${C} w-full max-w-xl p-6 relative">
<button onclick="$('#modal').innerHTML=''" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
<h2 class="text-lg font-bold mb-4">Квартира №${a.n} (${FL(a.fl)}, ${a.rooms} комн, ${a.area} м²)</h2>
<div class="space-y-3">
 <div class="grid grid-cols-2 gap-3"><div><label class="text-xs text-slate-400">Цена за 1 м² ($)</label><input id="m_ppm" type="number" class="${IN}" value="${a.ppm}" ${canEdit()?'':'disabled'}></div><div><label class="text-xs text-slate-400">Статус</label><div class="py-2">${badge(s)}</div></div></div>
 <div><label class="text-xs text-slate-400">ФИО Покупателя</label><input id="m_name" class="${IN}" value="${esc(a.name)}" ${canEdit()?'':'disabled'}></div>
 <div class="grid grid-cols-2 gap-3"><div><label class="text-xs text-slate-400">Телефон</label><input id="m_phone" class="${IN}" value="${esc(a.phone)}" ${canEdit()?'':'disabled'}></div><div><label class="text-xs text-slate-400">Первый взнос ($)</label><input id="m_down" type="number" class="${IN}" value="${a.down}" ${canEdit()?'':'disabled'}></div></div>
 <div class="grid grid-cols-3 gap-3"><div><label class="text-xs text-slate-400">Срок (мес.)</label><input id="m_term" type="number" class="${IN}" value="${a.term}" ${canEdit()?'':'disabled'}></div><div><label class="text-xs text-slate-400">День платежа</label><input id="m_day" type="number" class="${IN}" value="${a.day}" ${canEdit()?'':'disabled'}></div><div><label class="text-xs text-slate-400">Дата договора</label><input id="m_start" type="date" class="${IN}" value="${a.start||iso(new Date())}" ${canEdit()?'':'disabled'}></div></div>
 <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-sm space-y-1"><div>Общая стоимость: <b>${fm(total(a))}</b></div><div>Оплачено: <b class="text-emerald-400">${fm(a.paid)}</b></div><div>Остаток долга: <b class="text-orange-400">${fm(total(a)-a.paid)}</b></div></div>
 ${s==='inst'&&can('pay')?`<div class="border-t border-slate-800 pt-3 mt-3"><h4 class="font-semibold text-sm mb-2">Принять платеж</h4><div class="flex gap-2"><input id="p_amt" type="number" class="${IN}" placeholder="Сумма в USD"><button onclick="doPay(${a.n})" class="${BTN}">Внести</button></div></div>`:''}
 <div class="flex justify-between items-center pt-2"><div class="flex gap-2">${a.name&&can('print')?`<button onclick="printSched(${a.n})" class="bg-slate-800 hover:bg-slate-700 rounded-xl px-3 py-2 text-xs"><i class="fa-solid fa-calendar-days mr-1"></i> График</button><button onclick="printContract(${a.n})" class="bg-slate-800 hover:bg-slate-700 rounded-xl px-3 py-2 text-xs"><i class="fa-solid fa-file-contract mr-1"></i> Договор</button>`:''}</div>
 <div class="flex gap-2">${canEdit()?`<button class="${BTN}" onclick="saveApt(${a.n})">Сохранить</button>`:''}</div></div>
</div></div></div>`;
}

function saveApt(n){const a=apts.find(x=>x.n===n);if(!a)return;
a.ppm=parseFloat($('#m_ppm').value)||a.ppm;a.name=$('#m_name').value.trim();a.phone=$('#m_phone').value.trim();
a.down=parseFloat($('#m_down').value)||0;a.term=parseInt($('#m_term').value)||12;a.day=parseInt($('#m_day').value)||10;
a.start=$('#m_start').value||a.start;if(a.name&&!a.mgr)a.mgr=me.login;sv();$('#modal').innerHTML='';draw()}

function doPay(n){const usd=parseFloat($('#p_amt').value);if(pay(n,usd)){$('#modal').innerHTML='';draw();alert('Платеж успешно принят!')}}
function chPass(){const p=prompt('Введите новый пароль:');if(p){me.pass=p;sv();alert('Пароль изменен!')}}

const tbl=(h,rows)=>`<div class="${C} overflow-x-auto"><table class="rt w-full text-sm"><thead class="text-slate-400 text-left border-b border-slate-800"><tr>${h.map(x=>`<th class="px-4 py-3 font-medium">${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr class="border-b border-slate-800/60 hover:bg-slate-800/40">${r.map((c,i)=>`<td class="px-4 py-3" data-l="${esc(h[i]||'')}">${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="px-4 py-10 text-center text-slate-500">Пока нет записей</td></tr>`}</tbody></table></div>`;
const link=n=>`<button class="text-blue-400 hover:underline" onclick="openApt(${n})">№${n}</button>`;

draw();
</script>
</body>
</html>
