function cmHTML(k,id,pre){const o=cmObj(k,id),L=o?o.cm||[]:[];return `<div class="space-y-2 max-h-64 overflow-y-auto mb-3">${L.length?L.map(c=>`<div class="rounded-xl border ${c.sys?'border-slate-800 bg-slate-950/50':'border-slate-700 bg-slate-950'} px-3 py-2 text-sm"><div class="flex justify-between gap-2 text-[11px] text-slate-500"><span>${esc(c.n||c.by)} · ${new Date(c.t).toLocaleString('ru-RU')}${c.sys?' · система':''}</span>${(isAdmin()||c.by===me.login)&&!c.sys?`<button class="text-red-400" title="Удалить" onclick="cmDel('${k}',${id},${c.id},'${pre}')"><i class="fa-solid fa-xmark"></i></button>`:''}</div><div class="${c.sys?'italic text-slate-400':''} whitespace-pre-wrap break-words">${esc(c.x)}</div></div>`).join(''):'<div class="text-xs text-slate-500">Комментариев пока нет</div>'}</div><div class="flex gap-2"><textarea id="cmt_${pre}" rows="2" class="${IN}" placeholder="Ваш комментарий…"></textarea><button class="${BTN} shrink-0" onclick="cmAdd('${k}',${id},'${pre}')">Добавить</button></div>`}
const cmRefresh=(k,id,pre)=>{const e=pre==='b'?$('#cmbox'):$('#cm2');if(e)e.innerHTML=cmHTML(k,id,pre)};
function cmOpen(k,id){const o=cmObj(k,id);if(!o)return;$('#modal2').innerHTML=`<div class="fixed inset-0 z-[60] bg-black/70 flex items-center justify-center p-4" onclick="if(event.target===this)closeC()"><div class="${C} w-full max-w-md p-5"><div class="flex justify-between mb-3 gap-2"><h2 class="font-bold text-sm">${k==='p'?'Комментарии · платёж ПКО № '+(o.no||'—')+' · '+esc(o.client):'Комментарии · договор кв. №'+o.n+' · '+esc(o.name)}</h2><button onclick="closeC()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div><div id="cm2">${cmHTML(k,id,'m')}</div></div></div>`}
const closeC=()=>{$('#modal2').innerHTML='';draw()};
function cmAdd(k,id,pre){const o=cmObj(k,id),e=$('#cmt_'+pre),t=e?e.value.trim():'';if(!o||!t)return;(o.cm=o.cm||[]).push({id:cmId(),by:me.login,n:me.name,t:new Date().toISOString(),x:t});sv();cmRefresh(k,id,pre);draw()}
function cmDel(k,id,cid,pre){const o=cmObj(k,id),c=o&&(o.cm||[]).find(x=>x.id===cid);if(!c||c.sys||!(isAdmin()||c.by===me.login))return;o.cm=o.cm.filter(x=>x.id!==cid);sv();cmRefresh(k,id,pre);draw()}
function releaseApt(n){if(!isAdmin()||!confirm('Расторгнуть договор по кв. №'+n+'? Покупатель и все его платежи будут удалены, квартира станет свободной.'))return;const ra=apts.find(a=>a.n===n);sysCm(ra,'Договор расторгнут (покупатель: '+ra.name+')');pays=pays.filter(p=>p.apt!==n);Object.assign(ra,{mgr:'',name:'',phone:'',down:0,paid:0,start:'',term:12,day:10});sv();closeM();draw()}
// ---------- настройки ----------

 <hr class="border-slate-800"><h3 class="font-semibold text-red-400">Опасная зона</h3><button class="bg-red-600/20 text-red-400 border border-red-600/40 rounded-xl px-4 py-2 text-sm hover:bg-red-600/30" onclick="resetAll()">Сбросить базу</button></div>
 <div class="${C} p-5 lg:col-span-2"><h3 class="font-semibold mb-3">Сотрудники</h3><div class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-4"><input id="un" class="${IN}" placeholder="ФИО"><input id="ul" class="${IN}" placeholder="Логин"><input id="up" class="${IN}" placeholder="Пароль"><select id="ur" class="${IN}">${roleOpts('user')}</select><select id="uo" class="${IN}">${posOpts('')}</select><button class="${BTN}" onclick="addUser()"><i class="fa-solid fa-user-plus mr-1"></i>Добавить</button></div>
 ${tbl(['ФИО','Логин','Пароль','Роль','Должность',''],users.map((u,i)=>[esc(u.name),esc(u.login),`<input class="${IN} !w-36 !py-1 font-mono" value="${esc(u.pass)}" onchange="setPass(${i},this.value)">`,`<select class="${IN} !w-auto" onchange="setRole(${i},this.value)">${roleOpts(u.role)}</select>`,`<select class="${IN} !w-auto" onchange="setPos(${i},this.value)">${posOpts(u.pos||'')}</select>`,u.login===me.login?'<span class="text-slate-600 text-xs">это вы</span>':`<button class="text-red-400 hover:text-red-300 text-xs" onclick="delUser(${i})">Удалить доступ</button>`]))}</div></div>${rolesUI()}${tplUI()}${backupUI()}`}
const PERMS=[['tab_dash','Вкладка «Дашборд»'],['tab_owners','Вкладка «Собственники»'],['tab_inst','Вкладка «Рассрочки»'],['tab_next','Вкладка «Ближайшие платежи»'],['tab_late','Вкладка «Журнал просрочек»'],['tab_log','Вкладка «Журнал оплат»'],['pay','Принимать платежи'],['edit','Редактировать договоры и данные клиентов'],['chgMgr','Менять ответственного менеджера по договору'],['editPay','Редактировать платежи и их даты, вносить задним числом'],['delPay','Удалять платежи'],['print','Печать графика платежей'],['export','Экспорт в PDF и Excel']];
const roleOpts=v=>S.roles.map(r=>`<option value="${esc(r.id)}" ${r.id===v?'selected':''}>${esc(r.name)}</option>`).join(''),posOpts=v=>`<option value="">— без должности —</option>`+S.positions.map(p=>`<option ${p===v?'selected':''}>${esc(p)}</option>`).join('');
function setRole(i,v){if(users[i].login===me.login){alert('Свою роль менять нельзя');return draw()}users[i].role=v;sv();draw()}
function setPos(i,v){users[i].pos=v;sv();draw()}
function addRole(){const n=$('#nr').value.trim();if(!n)return alert('Введите название роли');S.roles.push({id:'r'+Date.now(),name:n,perms:{tab_dash:1,tab_owners:1,tab_inst:1,tab_next:1,tab_late:1,tab_log:1,pay:1,print:1}});sv();draw()}
function renRole(i,v){v=v.trim();if(v){S.roles[i].name=v;sv();draw()}}
function delRole(i){const r=S.roles[i];if(users.some(u=>u.role===r.id))return alert('Роль назначена сотрудникам — сначала смените им роль');if(confirm('Удалить роль «'+r.name+'»?')){S.roles.splice(i,1);sv();draw()}}
function addPos(){const v=$('#np').value.trim();if(!v||S.positions.includes(v))return;S.positions.push(v);sv();draw()}
function delPos(i){const v=S.positions[i];if(confirm('Удалить должность «'+v+'»? У сотрудников она будет снята.')){users.forEach(u=>{if(u.pos===v)u.pos=''});S.positions.splice(i,1);sv();draw()}}
function rolesUI(){return `<div class="${C} p-5 mt-4"><div class="flex flex-wrap justify-between gap-2 mb-3"><h3 class="font-semibold">Роли и права доступа</h3><div class="flex gap-2"><input id="nr" class="${IN} !w-56" placeholder="Название новой роли"><button class="${BTN}" onclick="addRole()">Создать роль</button></div></div>
 <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3">${S.roles.map((r,ri)=>`<div class="border border-slate-800 rounded-xl p-3"><div class="flex gap-2 mb-2">${r.sys?`<div class="font-semibold flex-1">${esc(r.name)} <span class="text-xs text-slate-500">· полный доступ, включая «Настройки»</span></div>`:`<input class="${IN} !py-1 flex-1" value="${esc(r.name)}" onchange="renRole(${ri},this.value)"><button class="text-red-400 text-xs" onclick="delRole(${ri})">Удалить</button>`}</div>${r.sys?'':PERMS.map(([k,l])=>`<label class="flex items-center gap-2 text-xs py-0.5"><input type="checkbox" ${r.perms[k]?'checked':''} onchange="S.roles[${ri}].perms['${k}']=this.checked?1:0;sv()"> ${l}</label>`).join('')}</div>`).join('')}</div>
 <p class="text-xs text-slate-500 mt-3">Шахматка доступна всем ролям. Вкладка «Настройки» и управление пользователями — только у роли «Администратор». Права применяются сразу.</p></div>
 <div class="${C} p-5 mt-4"><h3 class="font-semibold mb-3">Должности</h3><div class="flex flex-wrap gap-2 mb-3">${S.positions.map((p,i)=>`<span class="px-3 py-1 rounded-xl border border-slate-700 text-sm">${esc(p)} <button class="text-red-400 ml-2" onclick="delPos(${i})">×</button></span>`).join('')||'<span class="text-slate-500 text-sm">Должностей пока нет</span>'}</div><div class="flex gap-2"><input id="np" class="${IN} !w-64" placeholder="Новая должность"><button class="${BTN}" onclick="addPos()">Добавить</button></div></div>`}
const set=()=>set0()+struct();
function struct(){const fl=[...new Set(apts.map(a=>a.fl))].sort((a,b)=>b-a),I=(n,f,v,w)=>`<input type="number" step="0.01" value="${v}" class="${IN} ${w} !py-1" onchange="editApt(${n},'${f}',this.value)">`;
 return `<div class="${C} p-5 mt-4"><h3 class="font-semibold mb-3">Название компании и ЖК</h3><div class="grid md:grid-cols-3 gap-2"><input id="bc" class="${IN}" value="${esc(S.company)}" placeholder="Компания"><input id="bp" class="${IN}" value="${esc(S.project)}" placeholder="ЖК"><button class="${BTN}" onclick="saveBrand()">Сохранить названия</button></div></div>
 <div class="${C} p-5 mt-4"><div class="flex flex-wrap items-center justify-between gap-2 mb-1"><h3 class="font-semibold">Структура шахматки, площади и цены</h3><div class="flex flex-wrap gap-2 text-sm"><input id="bulk" type="number" class="${IN} !w-28" placeholder="Цена ${cur==='USD'?'$':'c.'}/м²"><button class="${BTN}" onclick="bulkPrice()">Цена всем</button><input id="nf" type="number" class="${IN} !w-24" placeholder="Этаж"><button class="${BTN}" onclick="addFloor()">Добавить этаж</button><button class="bg-slate-800 hover:bg-slate-700 rounded-xl px-3" title="Вернуть сквозную нумерацию" onclick="resetNum()">Сбросить номера</button></div></div>
 <p class="text-xs text-slate-500 mb-3">Цена за м² вводится и показывается в выбранной валюте (хранится в долларах, пересчёт по курсу). Номер квартиры можно изменить вручную (если номер занят — предложим поменять местами); платежи остаются у своей квартиры. Остальные квартиры нумеруются сквозно автоматически. Удалить можно только свободную квартиру без оплат.</p>
 <div class="space-y-3">${fl.map(f=>`<div class="border border-slate-800 rounded-xl p-3"><div class="flex justify-between mb-2"><b class="text-sm">${FL(f)}</b><div class="flex gap-3 text-xs"><button class="text-blue-400" onclick="addApt(${f})"><i class="fa-solid fa-plus"></i> Квартира</button><button class="text-red-400" onclick="delFloor(${f})">Удалить этаж</button></div></div><div class="flex flex-wrap gap-2">${apts.filter(a=>a.fl===f).map(a=>`<div class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs space-y-1"><div class="flex justify-between items-center"><label class="flex items-center gap-1"><b>№</b><input type="number" min="1" value="${a.n}" class="${IN} !w-16 !py-0 font-bold" onchange="setNum(${a.n},this.value)"></label><button class="text-red-400" onclick="delApt(${a.n})"><i class="fa-solid fa-trash"></i></button></div><label class="flex items-center justify-between gap-1">Комн ${I(a.n,'rooms',a.rooms,'w-16')}</label><label class="flex items-center justify-between gap-1">м² ${I(a.n,'area',a.area,'w-20')}</label><label class="flex items-center justify-between gap-1">${cur==='USD'?'$':'c.'}/м² ${I(a.n,'ppm',r2(fromUSD(a.ppm)),'w-20')}</label></div>`).join('')}</div></div>`).join('')}</div></div>`}
function saveBrand(){S.company=$('#bc').value.trim()||S.company;S.project=$('#bp').value.trim()||S.project;sv();draw()}
function editApt(n,f,v){if(!isAdmin())return;v=parseFloat(v);if(!(v>0))return draw();apts.find(a=>a.n===n)[f]=f==='rooms'?Math.round(v):f==='ppm'?toUSD(v):v;sv();draw()}
function bulkPrice(){const v=parseFloat($('#bulk').value);if(!(v>0)||!confirm('Установить цену '+v+' '+(cur==='USD'?'$':'c.')+'/м² для всех квартир? Суммы по действующим договорам изменятся.'))return;apts.forEach(a=>a.ppm=toUSD(v));sv();draw()}
function renum(){apts.forEach(a=>a._o=a.n);apts.sort((x,y)=>x.fl-y.fl||x._o-y._o);const used=new Set(apts.filter(a=>a.fix).map(a=>a.n)),m={};let k=0;apts.forEach(a=>{if(!a.fix){do k++;while(used.has(k));a.n=k}m[a._o]=a.n;delete a._o});pays.forEach(p=>{if(m[p.apt]!=null)p.apt=m[p.apt]})}
function setNum(n,v){if(!isAdmin())return;v=parseInt(v);const a=apts.find(x=>x.n===n);if(!(v>=1&&v<=9999)){alert('Номер — целое число от 1 до 9999');return draw()}if(v===n)return;const o=apts.find(x=>x.n===v);
 if(o){if(!confirm('Номер '+v+' занят квартирой ('+FL(o.fl)+'). Поменять номера местами?'))return draw();pays.forEach(p=>{if(p.apt===n)p.apt=-1;else if(p.apt===v)p.apt=-2});o.n=n;o.fix=true;pays.forEach(p=>{if(p.apt===-1)p.apt=v;else if(p.apt===-2)p.apt=n})}else pays.forEach(p=>{if(p.apt===n)p.apt=v});
 a.n=v;a.fix=true;apts.sort((x,y)=>x.fl-y.fl||x.n-y.n);sv();draw()}
function resetNum(){if(!isAdmin()||!confirm('Вернуть сквозную нумерацию 1, 2, 3… по этажам? Платежи останутся у своих квартир.'))return;apts.forEach(a=>delete a.fix);renum();sv();draw()}
function addApt(f){apts.push({n:Math.max(0,...apts.map(a=>a.n))+1,fl:f,rooms:2,area:50,ppm:apts.length?apts[0].ppm:550,name:'',phone:'',down:0,term:12,day:10,paid:0,start:''});renum();sv();draw()}
function addFloor(){const v=parseInt($('#nf').value);if(!v||apts.some(a=>a.fl===v))return alert('Укажите номер нового этажа: не 0 и не существующий (минус — цоколь)');addApt(v)}
function delApt(n){const a=apts.find(x=>x.n===n);if(st(a)!=='free'||a.paid>0)return alert('Нельзя удалить квартиру с покупателем или оплатами');if(!confirm('Удалить квартиру №'+n+'? Остальные номера сдвинутся.'))return;apts=apts.filter(x=>x.n!==n);pays=pays.filter(p=>p.apt!==n);renum();sv();draw()}
function delFloor(f){const L=apts.filter(a=>a.fl===f);if(L.some(a=>st(a)!=='free'||a.paid>0))return alert('На этаже есть проданные или забронированные квартиры');if(!confirm('Удалить '+FL(f)+' и все его квартиры?'))return;const ns=L.map(a=>a.n);apts=apts.filter(a=>a.fl!==f);pays=pays.filter(p=>!ns.includes(p.apt));renum();sv();draw()}
function preview(a,g,tot,down,m){const term=Math.round(g('f_term')),day=Math.min(31,Math.max(1,g('f_day')||1)),s0=$('#f_start').value?new Date($('#f_start').value+'T00:00:00'):today0();
 if(!(tot>0)||down>=tot||term<1){$('#prev').innerHTML='';return}
 const R=(a1,a2,a3,a4)=>`<tr class="border-b border-slate-800/60"><td class="px-3 py-1">${a1}</td><td class="px-3 py-1">${a2}</td><td class="px-3 py-1">${a3}</td><td class="px-3 py-1">${a4}</td></tr>`;let rem=tot-down,rows=down>0?R('Первый взнос',fd(s0),fm(down),fm(rem)):'';
 for(let k=1;k<=term;k++){const mo=s0.getMonth()+k,d=new Date(s0.getFullYear(),mo,Math.min(day,new Date(s0.getFullYear(),mo+1,0).getDate()));rem=Math.max(0,rem-m);rows+=R(k,fd(d),fm(m),fm(rem))}
 $('#prev').innerHTML=`<div class="text-sm font-semibold mb-2">Предварительный график <span class="text-xs font-normal text-slate-500">(пересчитывается при вводе${$('#f_start').value?'':', отсчёт от сегодняшней даты'})</span></div><div class="max-h-48 overflow-y-auto border border-slate-800 rounded-xl mb-4"><table class="w-full text-xs"><thead class="text-slate-400 text-left sticky top-0 bg-slate-900"><tr><th class="px-3 py-1">№</th><th class="px-3 py-1">Дата</th><th class="px-3 py-1">Сумма</th><th class="px-3 py-1">Остаток</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function addUser(){const u={name:$('#un').value.trim(),login:$('#ul').value.trim(),pass:$('#up').value,role:$('#ur').value,pos:$('#uo').value};if(!u.name||!u.login||!u.pass)return alert('Заполните ФИО, логин и пароль');if(users.some(x=>x.login===u.login))return alert('Такой логин уже есть');users.push(u);sv();draw()}
function delUser(i){if(confirm('Удалить доступ сотрудника '+users[i].name+'?')){users.splice(i,1);sv();draw()}}
function resetAll(){if(confirm('Удалить все оплаты и данные клиентов? Пользователи и курс останутся.')){apts=seed();pays=[];sv();draw()}}

 <div class="col-span-2">${L('ФИО покупателя',`<input id="f_name" value="${esc(a.name)}" ${DE} class="${IN}">`)}</div>${L('Телефон',`<input id="f_phone" value="${esc(a.phone)}" ${DE} class="${IN}">`)}
