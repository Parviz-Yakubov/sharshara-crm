3. ӮҲДАДОРИҲОИ ТАРАФҲО
3.1. «Сармоягузори соҳибшаванда» ӯҳдадор мегардад:
3.1.1. Маблағгузории сохтмони «Хонаи истиқоматӣ»-ро тибқи ҷадвали алоҳида тасдиқшудаи «Сармоягузор» аз лаҳзаи ба имзо расидани шартномаи мазкур амалӣ гардонад.
3.1.2. Тамоми пардохтҳо бо асъори миллӣ (сомонӣ) аз рӯи қурби бозорӣ ҳангоми ворид шудани маблағ муайян гашта, ба хазина ворид намояд.
3.1.3. Маблағгузории сохтмонии хонаи истиқоматиро бетаъхиргузорӣ сари вақт тибқи ҷадвали муқарраршуда пардохт намояд.
3.1.4. Тамоми намуди маблағи хизматрасониҳое, ки вобаста ба расмиятдарорӣ ва бақайдгирии давлатии молу мулки ғайриманқул, аз жумла шиносномаи техникӣ, амалиётҳои нотариалӣ, насби ҳисобчекунакҳои обӣ, барқӣ, газӣ ва ғайра алоқаманд бударо пардохт намояд.
3.1.5. Дар хонаи истиқоматӣ корҳои таъмирро то ба имзо расидани санади қабулу супоридани хонаи истиқоматӣ, нагузаронад.
3.1.6. Хонаи истиқоматии харидаро то ба расмиятдаровардани ҳужжатоҳои техникӣ ба номи худ гузаштан ба ташкилотҳои қарзӣ ё шахсони алоҳида ба гарав монда намешавад.
3.2. «Сармоягузор» ӯҳдадор мегардад:
3.2.1. Бақайдгирии шартномаро дар феҳристи «Сармоягузор» амалӣ гардонад.
3.2.2. Воситаҳои пулии «Сармоягузори соҳибшаванда» пешниҳоднамударо мақсаднок аз рӯи шартнома истифода барад.
3.2.3. Назорат аз рӯи иҷроиши ӯҳдадории вобаста ба сохтмон ва ба истифода додани хонаи истиқоматӣ {{срок_сдачи}} ба анҷом мерасад.
3.2.4. Дар давоми 3(се) моҳ баъди супоридани «Хонаи истиқоматӣ» ҳуҷҷатҳои ҳуқуқӣ, аз он ҷумла, шиносномаи техникӣ, шартномаи хариду фурӯшро барои ба таври нотариалӣ супоридани хонаи истиқоматӣ ба моликияти «Сармоягузори соҳибшаванда» ба расмият дарорад.
3.2.5. Корҳои сохтмонӣ, аз ҷумла пурра анҷомдиҳии корҳои пешайвони тибқи лоиҳа, пурра омода намудани даромад ба бино, ба итмом расонидани зинапоя ва майдонча, равшанигардонии ҷойгиркунии дарҳои даромади бино ва ҳуҷра, гузаронидани корҳои коммуникатсионӣ то ҳуҷра, иҷро намудани деворҳои байниҳуҷравӣ, таъмини объект бо об, барқ ва корҳои ободонии ҳудуд ва ҷойгиркунии оинаҳои беруна барои ба истифода додан ва ба расмиятдарории моликият омодашуда, роҳандозӣ ва амалӣ менамояд.

3.2.7. Ҳангоми дар муҳлати пай дар пай ду моҳ ба таъхиргузории пардохти маблағгузории сохтмони хонаи истиқоматӣ аз тарафи «Сармоягузори соҳибшаванда», маблағгузории сохтмони хонаи истиқоматӣ ба шахси сеюм гузаронида, маблағи пардохтшудаи «Сармоягузори соҳибшаванда»-ро бо назардошти 3% (се фоиз)-и кам аз маблағи пардохтшуда, бозпас мегардонад.
4. МАСЪУЛИЯТИ ТАРАФҲО
4.1. «Сармоягузор» ва «Сармоягузори соҳибшаванда» аз рӯи ӯҳдадориҳои бо шартномаи мазкур муқарраршуда ва пешбинигардида масъулият доранд.
4.2. «Сармоягузори соҳибшаванда» барои саривақт амалигардонии пардохти воситаҳои пулӣ дар мӯҳлати шартнома муайянгашта масъулият дорад.
4.3. «Сармоягузор» барои сари вақт напардохтани маблағи боқимондаи пули тибқи ҷадвал аз тарафи «Сармоягузори соҳибшаванда» дар давоми ду моҳ пас аз ба имзо расидани шартномаи мазкур, хонаи истиқоматӣ ба шахси сеюм фурӯхта шуда, маблағи пардохтшуда пас аз фурӯши хонаи истиқоматӣ ба «Сармоягузори соҳибшаванда» аз маблағи умумии супоридашуда 3% (се фоиз) кам баргардонида мешавад.
4.3. Тартиби пардохти маблағи сохтмонӣ тибқи ҷадвали алоҳида аз тарафи «Сармоягузор» муқаррар карда мешавад.
4.3. «Сармоягузори соҳибшаванда» ҳуқуқ дорад, ки бо тартиби яктарафа шартномаи мазкурро бо огоҳкунии ҳатмии хаттии «Сармоягузор», ба мӯҳлати 30(сӣ) рӯз пештар бекор намояд.
4.4. Ҳангоми барасмиятдарорӣ дар натиҷаи бақайдгирии давлатии молу мулки ғайриманқул аз тарафи КДФ «БММҒ» тағйирёбии масоҳати умумии лоиҳавии хонаи истиқоматӣ, маблағи пардохтшудаи изофагӣ аз тарафи «Сармоягузор» баргардонида мешавад ва дар натиҷаи зиёдшавии масоҳати хонаи истиқоматӣ аз рӯи шиносномаи техникӣ аз тарафи «Сармоягузори соҳибшаванда» мутаносибан боқимонда маблағ пардохт карда мешавад.
5. ҲОЛАТҲОИ РАФЪНОПАЗИР (ФОРС МАЖОР)
5.1. Тарафҳо барои иҷро накардан ё иҷрои номатлуби ӯҳдадориҳо аз рӯи шартномаи мазкур аз ҷавобгарӣ озод карда мешаванд, агар имконнопазирии иҷро ба қувваи рафънопазир алоқаманд буда, дар натиҷаи ҳолатҳои фавқулода ва ғайричашмдошт ба миён омада бошад.
5.2. Тарафҳо зери мафҳуми ҳолатҳои рафънопазир чунин ҳолатҳоро мувофиқа намудаанд:
-обхезӣ, заминҷунбӣ, офатҳои табиӣ, қабули қарорҳои аз тарафи мақомоти иҷроияи маҳаллии ҳокимияти давлатӣ, ки иҷрои шартномаи мазкурро ғайриимкон месозад.
5. ШАРТҲОИ ДИГАР
5.1. Тағйиру иловаҳо ба шартномаи мазкур танҳо бо розигии «Тарафҳо» амалӣ карда мешавад.
5.2. Тамоми маълумотҳо аз ҷониби «Тарафҳо» ба якдигар пешниҳодгашта, ки бо бастан ва иҷроиши шартномаи мазкур алоқаманданд, махфӣ ба ҳисоб мераванд.
5.3. «Сармоягузори соҳибшаванда» ҳуқуқ дорад, ки бо ба мувофиқагардонии хаттӣ бо «Сармоягузор» ҳуқуқҳои худро аз рӯи шартномаи мазкур ба шахси сеюм супорад, агар аз тарафи охирин шартҳо ва ӯҳдадориҳои шартномаи мазкур қабул карда шавад.
5.4. Баҳсҳое, ки ҳангоми амалигардонии шартномаи мазкур пайдо мешавад, бо роҳи гуфтушунид ҳал мегарданд. Дар ҳолати ба мувофиқа наомадан, баҳс дар асоси қонунгузории амалкунандаи Ҷумҳурии Тоҷикистон тариқи мақомоти судии дахлдор ҳал карда мешавад.
5.5. Мутобиқи банди 3 ва зербанди 3.1.1 маблағи умумӣ аз рӯзи бастани шартнома бо асъори миллӣ(сомонӣ) аз рӯи шартномаи мазкур пардохт мегардад.
6. МӮҲЛАТИ АМАЛИ ШАРТНОМА
6.1. Шартномаи мазкур аз лаҳзаи ба имзо расидани он аз ҷониби «Тарафҳо» эътибор дошта, то расмӣ гардонидани ҳуқуқи моликияти хусусии «Сармоягузори соҳибшаванда» ба «Хонаи истиқоматӣ» мазкур амал менамояд.
7. МУҚАРРАРОТИ ХОТИМАВӢ
9.1. Тағйир ёфтани соҳибҳуқуқи шахси ҳуқуқӣ барои бекор гардидани шартномаи мазкур асос шуда наметавонад.
9.2. Дар мавриди азнавташкилдиҳии шахси ҳуқуқӣ, ки яке аз тарафҳои шартнома мебошад, ҳамаи ҳуқуқ ва ӯҳдадориҳо, ки аз шартномаи мазкур бар меояд, ба вориси шахси ҳуқуқии азнавташкилшуда мегузарад.
